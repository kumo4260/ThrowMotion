<!DOCTYPE html>
{% load static %}
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요새전 {{ room_code }} - 새총 대전</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #12161f;
    color: #eef1f6;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    overflow: hidden;
  }
  /* 게임 화면이 상단 바를 뺀 브라우저 창 전체를 쓰도록 세로로 꽉 채운다. */
  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #ui-bar {
    flex: none;
    flex-wrap: wrap;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    min-height: 56px;
    box-sizing: border-box;
    background: rgba(12, 15, 21, 0.95);
    border-bottom: 1px solid #2d3545;
  }
  #ui-bar h1 {
    font-size: 16px;
    margin: 0 8px 0 0;
  }
  #ui-bar h1 a { display: flex; align-items: center; gap: 8px; color: #ffd76a; text-decoration: none; }
  #ui-bar h1 .logo {
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff8a7a, #e24b4a 60%, #9b2626);
    box-shadow: 0 0 0 2px #791f1f;
  }
  #ui-bar .sep { width: 1px; height: 22px; background: #2d3545; }
  #ui-bar a.nav-btn {
    color: #c9d1dd;
    text-decoration: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
  }
  #ui-bar a.nav-btn:hover { background: #222937; color: #eef1f6; }
  #map-title { font-weight: bold; color: #eef1f6; font-size: 14px; }
  #ui-bar button {
    background: #222937;
    color: #eef1f6;
    border: 1px solid #2d3545;
    border-radius: 8px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  #ui-bar button:hover { background: #2d3545; }
  #ui-bar button.active { background: #ffb020; color: #1b1f27; font-weight: bold; }
  /* 마우스/캠 모드 전환은 붙어 있는 토글 버튼 한 묶음 */
  #ui-bar .toggle { display: inline-flex; padding: 3px; background: #0c0f15; border: 1px solid #2d3545; border-radius: 10px; }
  #ui-bar .toggle button { border: 0; background: none; color: #98a2b3; border-radius: 7px; }
  #ui-bar .toggle button.active { background: #4bc86a; color: #10241a; font-weight: bold; }
  /* Phaser(Scale.FIT)가 이 영역에 맞춰 캔버스를 비율 유지로 키우고 가운데 둔다. */
  #game-container {
    flex: 1;
    min-height: 0;
    width: 100%;
    overflow: hidden;
  }
  #note {
    margin-left: auto;
    font-size: 12px;
    color: #98a2b3;
  }
  #game-container {
    position: relative;
  }
  #cam-box {
    position: fixed;
    top: 72px;
    right: 16px;
    width: 220px;
    display: none;
    flex-direction: column;
    gap: 6px;
    background: rgba(12, 15, 21, 0.92);
    border: 1px solid #2d3545;
    border-radius: 12px;
    padding: 8px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    z-index: 10;
  }
  #cam-video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
  }
  #cam-video, #cam-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1); /* 거울 모드로 자연스럽게 보이도록 좌우 반전 */
  }
  #account-box {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  #account-box a { color: #ffd76a; }
  #account-box form { margin: 0; }
  #room-code { font-family: monospace; font-size: 15px; color: #ffd76a; letter-spacing: 2px; }
  #players { font-size: 13px; display: flex; gap: 10px; }
  #players .p { padding: 3px 10px; border-radius: 12px; background: #2c313c; }
  #players .p.turn { background: #ffb020; color: #1b1f27; font-weight: bold; }
  #players .p.off { opacity: 0.5; }
  #players .p1 { border-left: 4px solid #4a8fe2; }
  #players .p2 { border-left: 4px solid #e24b4a; }
  #cam-status {
    font-size: 12px;
    color: #9aa3b2;
    text-align: center;
  }
</style>
</head>
<body>

<div id="ui-bar">
  <h1><a href="{% url 'home' %}"><span class="logo"></span>새총 대전</a></h1>
  <a class="nav-btn" href="{% url 'battle:lobby' %}">← 로비</a>
  <span>방 코드 <span id="room-code">{{ room_code }}</span></span>
  <span id="players"></span>
  <span class="sep"></span>
  <span class="toggle">
    <button id="mouse-mode-btn" class="mode-btn active">마우스 모드</button>
    <button id="cam-mode-btn" class="mode-btn">캠 모드</button>
  </span>
  <span id="note">상대를 기다리는 중...</span>
  <span id="account-box">{{ user.username }}</span>
</div>

<div id="game-container">
  <div id="cam-box">
    <div id="cam-video-wrap">
      <video id="cam-video" autoplay playsinline muted></video>
      <canvas id="cam-overlay"></canvas>
    </div>
    <div id="cam-status">카메라 대기 중</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
{{ map|json_script:"map-data" }}
<script>
  window.BATTLE = {
    wsPath: "/ws/battle/{{ room_code }}/",
    lobbyUrl: "{% url 'battle:lobby' %}",
    myName: "{{ user.username|escapejs }}",
  };
</script>
<script src="{% static 'game/js/physics.js' %}"></script>
<script src="{% static 'game/js/visuals.js' %}"></script>
<script src="{% static 'battle/js/battle.js' %}"></script>
<script type="module" src="{% static 'game/js/hand_control.js' %}"></script>

</body>
</html>
